# ----------------------------------------------------- 
# --- HYPRLOCK | Adapted from github.com/elifouts/Dotfiles ---
# ----------------------------------------------------- 

$cyan = rgb(00ffff)
$deep_ocean = rgb(005f5f)
$background = rgb(050505)
$wallpaper = $HOME/.config/wallpapers/Meptl.png

# --- DISPLAY ---
background {
    monitor = 
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = 0.6
}

# --- PIN ENTRY ---
input-field {
    monitor = 
    size = 250, 50
    outline_thickness = 2
    dots_rounding = 4
    dots_spacing = 0.5
    dots_fade_time = 300
    inner_color = $background
    outer_color = $deep_ocean $cyan
    check_color = $cyan $deep_ocean
    fail_color = rgb(ff005f) rgb(050505)
    font_color = $cyan
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 2
    rounding = 13
    placeholder_text = <i>Your Password...</i>
    fail_text = <b>FAIL</b>
    fail_timeout = 300
    position = 0, 0
    halign = center
    valign = center
}
